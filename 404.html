<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Página não encontrada | Gamer Extremo</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <meta name="theme-color" content="#1a1a2e">

    <!-- Anti-flash de tema -->
    <script>
        (function () {
            try {
                if (localStorage.getItem('theme') === 'light')
                    document.documentElement.classList.add('preload-light');
            } catch (e) {}
        })();
    </script>
    <style>
        html.preload-light body { background: #f4f4f8; color: #1a1a2e; }
    </style>
</head>
<body>

    <header>
        <a href="index.html"><h1>Gamer <span>Extremo</span></h1></a>
        <p>GAMES • APPS • ANIMES</p>
        <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="Alternar tema">☀️</button>
    </header>

    <nav>
        <a href="index.html">🏠 Início</a>
        <a href="index.html#apps">📱 Nossos Apps</a>
        <a href="sobre.html">🏢 Sobre</a>
    </nav>

    <main>
        <section class="card-block error-page">
            <div class="code">404</div>
            <h2>Página não encontrada</h2>
            <p>A página que você procura não existe ou foi movida. Verifique o endereço ou volte para o início.</p>
            <div class="btn-group">
                <a href="index.html" class="btn">🏠 Voltar ao início</a>
                <a href="index.html#apps" class="btn btn-outline">📱 Ver apps</a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Gamer Extremo. Todos os direitos reservados.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.documentElement.classList.remove('preload-light');
        });
    </script>
    <script src="js/common.js"></script>
</body>
</html>
